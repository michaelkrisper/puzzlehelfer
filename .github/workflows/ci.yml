name: CI

# Checks every push and pull request (lint, unit and recognition tests,
# browser test) and publishes main to GitHub Pages.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx biome ci
      - name: Ruff (tools/*.py)
        run: |
          pipx run ruff check tools
          pipx run ruff format --check tools
      # Test photos are generated by tools/synth.py from tests/fixtures/picture.jpg.
      - run: pip install pillow numpy
      - run: npm test
      # Chrome is preinstalled on the runner.
      - run: npm run test:e2e

  # Every successful run on main is a patch release (tools/release.mjs):
  # commit and tag it on top of the tested commit. If main moved on in the
  # meantime, the newer run releases both. Pushes with the GITHUB_TOKEN start
  # no workflow run, so this does not loop.
  release:
    name: Version
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    outputs:
      sha: ${{ steps.bump.outputs.sha }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: bump
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          v=$(node tools/release.mjs)
          git commit -qam "Release $v"
          git tag "v$v"
          if git push --atomic origin HEAD:main "refs/tags/v$v"; then
            echo "version=$v" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "main moved on; the newer run releases"
          fi

  deploy:
    name: GitHub Pages
    needs: release
    if: needs.release.outputs.sha != ''
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.sha }}
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html style.css app.js worker.js sw.js manifest.webmanifest core icons vendor _site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: pages
        uses: actions/deploy-pages@v5
