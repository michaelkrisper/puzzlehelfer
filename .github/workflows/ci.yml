name: CI

# Checks every push and pull request (lint, unit and recognition tests,
# browser test) and publishes main to GitHub Pages.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx biome ci
      - name: Ruff (tools/*.py)
        run: |
          pipx run ruff check tools
          pipx run ruff format --check tools
      # Test photos are generated by tools/synth.py from tests/fixtures/picture.jpg.
      - run: pip install pillow numpy
      - run: npm test
      # Chrome is preinstalled on the runner.
      - run: npm run test:e2e

  # Tags every tested commit on main with the next patch version (vX.Y.Z).
  version:
    name: Version tag
    needs: [check]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: version-tag
      cancel-in-progress: false
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: tag
        run: python3 .github/scripts/release.py tag
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    name: GitHub Pages
    # Only commits that got a version tag: a re-run of an older run deploys nothing.
    needs: [check, version]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Stamp version
        run: node tools/stamp-version.mjs "${{ needs.version.outputs.version }}"
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html style.css app.js worker.js sw.js manifest.webmanifest core icons vendor _site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: pages
        uses: actions/deploy-pages@v5
