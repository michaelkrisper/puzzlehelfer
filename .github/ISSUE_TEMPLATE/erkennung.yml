name: Wrong recognition
description: Pieces not found, wrong place or wrong rotation
labels: [erkennung]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! Photos help most: the reference photo and the pieces photo.
        Please only attach photos you took yourself; they become public here.
  - type: textarea
    id: was
    attributes:
      label: What happened?
      description: e.g. "piece 4 belongs one column further left" or "eight pieces not recognised"
    validations:
      required: true
  - type: textarea
    id: fotos
    attributes:
      label: Photos
      description: Drag or paste the reference and the pieces photo here.
  - type: input
    id: teile
    attributes:
      label: Piece count and grid
      placeholder: 500 pieces, 25 × 20
  - type: input
    id: geraet
    attributes:
      label: Device and browser
      placeholder: iPhone 16, Safari 26
