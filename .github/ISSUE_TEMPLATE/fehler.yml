name: Bug
description: Something does not work (camera, display, crash)
labels: [bug]
body:
  - type: textarea
    id: was
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: schritte
    attributes:
      label: Steps to reproduce
  - type: input
    id: geraet
    attributes:
      label: Device and browser
      placeholder: Pixel 9, Chrome 152
